<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bouquet For You</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #592037 0%, #2a111f 50%, #0d080c 100%);
      font-family: 'Georgia', serif;
    }
    
    #flowerCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #messageContainer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    .message {
      position: absolute;
      background: rgba(80, 20, 40, 0.6);
      border: 1px solid rgba(255, 120, 140, 0.5);
      box-shadow: 0 0 20px rgba(255, 120, 140, 0.4);
      color: #fff0f3;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 15px;
      letter-spacing: 1px;
      text-align: center;
      white-space: nowrap;
      
      opacity: 0;
      transform: translateY(20px) scale(0.9);
      transition: opacity 2.5s ease-in-out, transform 2.5s ease-out;
    }

    .message.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    @media (max-width: 600px) {
      .message {
        font-size: 13px;
        padding: 10px 18px;
      }
    }
  </style>
</head>
<body>

<canvas id="flowerCanvas"></canvas>
<div id="messageContainer"></div>

<script>
  (function() {
    'use strict';

    const canvas = document.getElementById('flowerCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];
    let flowers = [];
    let time = 0;
    
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    const PARTICLE_COUNT = isMobile ? 40 : 80;

    const messagesPool = [
      "My whole heart", "Treasure every moment", "You make life beautiful",
      "Always yours", "You are my everything", "Thinking of you constantly",
      "My favorite person", "I love your smile", "Forever and always",
      "You are my sunshine", "Lucky to have you", "Endless love",
      "Just for you", "You're my safe place", "More than words can say"
    ];

    function spawnMessage() {
      const container = document.getElementById('messageContainer');
      const msg = document.createElement('div');
      msg.className = 'message';
      msg.innerText = messagesPool[Math.floor(Math.random() * messagesPool.length)];
      
      let left, top;
      let attempts = 0;
      do {
        left = 5 + Math.random() * 60; 
        top = 10 + Math.random() * 80; 
        attempts++;
      } while (
        (left > 25 && left < 70 && top > 25 && top < 80) && attempts < 50
      );
      
      msg.style.left = left + '%';
      msg.style.top = top + '%';
      container.appendChild(msg);
      
      setTimeout(() => msg.classList.add('visible'), 100);
      
      const visibleDuration = 4000 + Math.random() * 3000;
      setTimeout(() => {
        msg.classList.remove('visible');
        setTimeout(() => msg.remove(), 2500);
      }, visibleDuration);
    }

    function startMessageLoop() {
      spawnMessage();
      setTimeout(spawnMessage, 1500);
      setInterval(() => {
        spawnMessage();
      }, 3500);
    }

    function resize() {
      width = canvas.width = window.innerWidth || document.documentElement.clientWidth || 300;
      height = canvas.height = window.innerHeight || document.documentElement.clientHeight || 500;
      initBouquet();
    }
    window.addEventListener('resize', resize);

    function drawLeaf(x, y, rotation, scale, color1, color2) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);
      ctx.scale(scale, scale);
      
      const sway = Math.sin(time * 0.01 + x) * 0.03;
      ctx.rotate(sway);

      const leafGrd = ctx.createLinearGradient(0, 0, 0, -80);
      leafGrd.addColorStop(0, color1);
      leafGrd.addColorStop(1, color2);
      
      ctx.fillStyle = leafGrd;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(30, -40, 0, -80);
      ctx.quadraticCurveTo(-30, -40, 0, 0);
      ctx.fill();
      
      ctx.strokeStyle = 'rgba(0,0,0,0.3)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(5, -40, 0, -75);
      ctx.stroke();
      
      ctx.restore();
    }

    function drawFern(x, y, rotation, scale) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);
      ctx.scale(scale, scale);
      
      const sway = Math.sin(time * 0.015 + x) * 0.04;
      ctx.rotate(sway);

      ctx.fillStyle = '#2d5a45';
      ctx.strokeStyle = '#1e3d2f';
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(10, -50, 0, -100);
      ctx.stroke();

      for(let i = 10; i < 90; i+= 8) {
        let leafSize = Math.max(0.1, (100 - i) * 0.15); 
        let localSway = Math.sin(time * 0.03 + i) * 2;
        
        ctx.beginPath();
        ctx.ellipse(5 + leafSize + localSway, -i, leafSize * 2, leafSize * 0.7, Math.PI / 6, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.beginPath();
        ctx.ellipse(-5 - leafSize + localSway, -i, leafSize * 2, leafSize * 0.7, -Math.PI / 6, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // --- ULTRA-REALISTIC FRANGIPANI CLASS ---
    class Frangipani {
      constructor(xOffset, yOffset, targetScale, delay) {
        this.xOffset = xOffset;
        this.yOffset = yOffset;
        this.targetScale = targetScale;
        this.delay = delay;
        this.bloom = 0;
        this.swaySpeed = 0.01 + Math.random() * 0.01;
        this.swaySeed = Math.random() * Math.PI * 2;
        this.rotationOffset = (Math.random() - 0.5) * 0.5;
      }

      draw(cx, cy, globalScale) {
        if (time > this.delay && this.bloom < this.targetScale) {
          this.bloom += (this.targetScale - this.bloom) * 0.02;
        }
        
        if (this.bloom <= 0.01) return;

        ctx.save();
        
        const x = cx + (this.xOffset * globalScale);
        const y = cy + (this.yOffset * globalScale);
        ctx.translate(x, y);
        
        const sway = Math.sin(time * this.swaySpeed + this.swaySeed) * 0.08;
        ctx.rotate(this.rotationOffset + sway);
        
        ctx.scale(this.bloom * globalScale, this.bloom * globalScale);
        
        // Realistic 5 overlapping Frangipani petals with organic pinwheel twist shape
        for(let j = 0; j < 5; j++) {
          ctx.save();
          ctx.rotate((j * 2 * Math.PI / 5));
          
          // Realistic petal shadow for depth
          ctx.shadowBlur = 4;
          ctx.shadowColor = 'rgba(0,0,0,0.3)';
          ctx.shadowOffsetY = 3;

          // Multi-stop radial gradient for fleshy petal texture and soft edges
          const petalGrd = ctx.createRadialGradient(0, -22, 2, 0, -22, 32);
          petalGrd.addColorStop(0, '#ffffff');
          petalGrd.addColorStop(0.35, '#fffceb'); // Warm inner ivory
          petalGrd.addColorStop(0.75, '#f4f0d8'); // Deeper rich tone near tips
          petalGrd.addColorStop(1, 'rgba(230, 220, 190, 0)');

          ctx.fillStyle = petalGrd;
          ctx.beginPath();
          // Organic curved spatula petal outline (characteristic of frangipanis)
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(18, -10, 26, -30, 12, -48);
          ctx.bezierCurveTo(5, -54, -5, -54, -12, -48);
          ctx.bezierCurveTo(-26, -30, -18, -10, 0, 0);
          ctx.closePath();
          ctx.fill();

          // Clear shadows for finer line details
          ctx.shadowBlur = 0;
          ctx.shadowOffsetY = 0;

          // Subtle organic vein shading along the center of each petal
          ctx.strokeStyle = 'rgba(210, 195, 150, 0.35)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(0, -4);
          ctx.lineTo(0, -42);
          ctx.stroke();

          ctx.restore();
        }
        
        // Highly realistic dense central core (golden-yellow center with deep pinwheel pocket)
        const centerGrd = ctx.createRadialGradient(0, 0, 0, 0, 0, 9);
        centerGrd.addColorStop(0, '#ff8f00'); // Deep rich yellow-orange center
        centerGrd.addColorStop(0.5, '#ffca28');
        centerGrd.addColorStop(0.85, '#fff176');
        centerGrd.addColorStop(1, 'rgba(255, 235, 59, 0)');

        ctx.fillStyle = centerGrd;
        ctx.beginPath();
        ctx.arc(0, 0, 9, 0, Math.PI * 2);
        ctx.fill();

        // Tiny textural dots/stamen details inside the yellow center ring
        ctx.fillStyle = '#e65100';
        for(let i = 0; i < 7; i++) {
          let angleDot = (i * Math.PI * 2) / 7;
          let rDot = 3.5;
          let dx = Math.cos(angleDot) * rDot;
          let dy = Math.sin(angleDot) * rDot;
          ctx.beginPath();
          ctx.arc(dx, dy, 0.9, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }
    }

    function initBouquet() {
      flowers = [];
      flowers.push(new Frangipani(-65, -35, 1.3, 50));  
      flowers.push(new Frangipani(65, -35, 1.3, 80));   
      flowers.push(new Frangipani(-75, 45, 1.4, 110));  
      flowers.push(new Frangipani(75, 45, 1.4, 140));   
      flowers.push(new Frangipani(0, 10, 1.9, 10));     
    }

    class GlowParticle {
      constructor() {
        this.reset(true);
      }
      reset(firstTime = false) {
        this.x = Math.random() * width;
        this.y = firstTime ? Math.random() * height : height + 10;
        this.vx = (Math.random() - 0.5) * 0.2;
        this.vy = -(0.2 + Math.random() * 0.3);
        this.size = 2 + Math.random() * 3;
        this.swaySeed = Math.random() * Math.PI * 2;
        this.color = Math.random() > 0.5 ? '#ffe0e5' : '#fff9d0';
        this.opacity = 0;
      }
      update() {
        this.x += this.vx + Math.sin(time * 0.01 + this.swaySeed) * 0.3;
        this.y += this.vy;
        
        if (this.opacity < 0.9 && this.y > 50) this.opacity += 0.005;
        else if (this.y < 50) this.opacity -= 0.02;

        if (this.y < -10 || this.opacity <= 0) this.reset();
      }
      draw() {
        ctx.globalAlpha = Math.max(0, this.opacity);
        ctx.fillStyle = this.color;
        
        ctx.shadowBlur = 15;
        ctx.shadowColor = this.color;
        
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.shadowBlur = 0; 
        ctx.globalAlpha = 1;
      }
    }

    function loop() {
      time++;
      ctx.clearRect(0, 0, width, height);

      const cx = width / 2;
      const cy = height / 2 + (isMobile ? 20 : 50); 
      const globalScale = Math.max(0.4, Math.min(width, height) / 800); 

      drawFern(cx - 80 * globalScale, cy + 40 * globalScale, -0.6, 1.2 * globalScale);
      drawFern(cx + 80 * globalScale, cy + 40 * globalScale, 0.6, 1.2 * globalScale);
      drawFern(cx - 30 * globalScale, cy - 20 * globalScale, -0.3, 1.4 * globalScale);
      drawFern(cx + 30 * globalScale, cy - 20 * globalScale, 0.3, 1.4 * globalScale);
      
      drawLeaf(cx - 100 * globalScale, cy + 80 * globalScale, -1.2, 1.5 * globalScale, '#1b4332', '#40916c');
      drawLeaf(cx + 100 * globalScale, cy + 80 * globalScale, 1.2, 1.5 * globalScale, '#1b4332', '#40916c');
      drawLeaf(cx, cy - 50 * globalScale, 0, 1.3 * globalScale, '#2d6a4f', '#74c69d');

      drawLeaf(cx - 40 * globalScale, cy + 90 * globalScale, -0.8, 1 * globalScale, '#081c15', '#2d6a4f');
      drawLeaf(cx + 40 * globalScale, cy + 90 * globalScale, 0.8, 1 * globalScale, '#081c15', '#2d6a4f');

      flowers.forEach(flower => flower.draw(cx, cy, globalScale));

      particles.forEach(p => {
        p.update();
        p.draw();
      });

      requestAnimationFrame(loop);
    }

    window.addEventListener('load', () => {
      resize();
      
      particles = [];
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push(new GlowParticle());
      }
      
      startMessageLoop();
      loop();
    });

  })();
</script>

</body>
</html>
