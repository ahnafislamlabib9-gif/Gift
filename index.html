<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Valentine Surprise</title>
    <style>
        :root {
            --primary: #ff4d6d;
            --secondary: #ff85a1;
            --bg: #ffe4e1;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            transition: background 1s ease;
        }

        /* Floating Hearts Animation */
        .heart {
            position: absolute;
            color: var(--primary);
            font-size: 20px;
            pointer-events: none;
            z-index: -1;
            animation: float 4s linear forwards;
        }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        #card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            padding: 2rem;
            border-radius: 2rem;
            box-shadow: 0 15px 35px rgba(255, 77, 109, 0.2);
            text-align: center;
            width: 85%;
            max-width: 400px;
            position: relative;
            z-index: 10;
        }

        .page { display: none; }
        .active { display: block; animation: fadeIn 0.8s ease-out; }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        img.main-img {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 20px;
            margin-bottom: 1rem;
            box-shadow: 0 0 20px rgba(255, 77, 109, 0.3);
        }

        /* Special Glow for Photo Page */
        .photo-glow {
            border: 4px solid white;
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from { box-shadow: 0 0 10px #fff, 0 0 20px #ff4d6d; }
            to { box-shadow: 0 0 20px #fff, 0 0 40px #ff85a1; }
        }

        h1 { color: var(--primary); font-size: 1.5rem; }

        /* GIFT BOX STYLES */
        .gift-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
        }

        .gift-box {
            background: var(--primary);
            height: 80px;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 2rem;
            color: white;
            transition: 0.3s;
            border: 3px solid white;
        }

        .gift-box.opened {
            background: #fff;
            color: var(--primary);
            border: 2px dashed var(--primary);
            font-size: 0.8rem;
            padding: 5px;
        }

        /* BUTTONS */
        button {
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            background-color: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.3);
        }

        #no-btn { background-color: #adb5bd; margin-left: 10px; transition: 0.2s; }
        .next-btn { width: 100%; margin-top: 15px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <audio id="loveMusic" loop>
        <source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mpeg">
    </audio>

    <div id="card">
        <div id="page1" class="page active">
            <img class="main-img" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpmeG53M2lyZ3JpZno3ZnhueHBybm54eHBybm54eHBybm54eCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1cfxvGOPVpf9g3y/giphy.gif">
            <h1 id="proposal-text">Will you be my Valentine?</h1>
            <button id="yes-btn" onclick="startExperience()">Yes</button>
            <button id="no-btn">No</button>
        </div>

        <div id="page2" class="page">
            <h1>Gifts for You! 🎁</h1>
            <div class="gift-container">
                <div class="gift-box" onclick="openGift(this, '🎟️ Online Movie Night')">🎁</div>
                <div class="gift-box" onclick="openGift(this, '🎮 Duo Gaming Date')">🎁</div>
                <div class="gift-box" onclick="openGift(this, '🍕 Will cook for you on the 1st day of our wedding')">🎁</div>
                <div class="gift-box" onclick="openGift(this, '📱 3h voice Call')">🎁</div>
            </div>
            <button id="gift-next" class="hidden next-btn" onclick="nextPage(3)">See More! →</button>
        </div>

        <div id="page3" class="page">
            <h1>My Favorite View... ❤️</h1>
            <img class="main-img photo-glow" src="https://i.postimg.cc/4NSsX3ty/IMG-17687362927272817.jpg" alt="Us">
            <p style="font-style: italic; color: #d63384;">"Every moment with you is like a dream."</p>
            <button class="next-btn" onclick="nextPage(4)">Last Surprise →</button>
        </div>

        <div id="page4" class="page">
            <img class="main-img" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpmeG53M2lyZ3JpZno3ZnhueHBybm54eHBybm54eHBybm54eCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/MDJ9IbxxvDUQM/giphy.gif">
            <h1>Official Valentine! ❤️</h1>
            <p>Be ready cuz we are about to embark on a new journey babyy!</p>
        </div>
    </div>

    <script>
        let yesScale = 1;
        let openedGifts = 0;
        const noMessages = ["Sure?", "Please?", "Think again!", "💔?", "Click Yes!"];
        let msgIndex = 0;

        const music = document.getElementById('loveMusic');
        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');

        // Initial Logic
        noBtn.addEventListener('click', () => {
            document.getElementById('proposal-text').innerText = noMessages[msgIndex];
            msgIndex = (msgIndex + 1) % noMessages.length;
            yesScale += 0.5;
            yesBtn.style.transform = `scale(${yesScale})`;
        });

        function startExperience() {
            music.play().catch(e => console.log("Music needs interaction first"));
            nextPage(2);
            setInterval(createHeart, 300); // Start heart rain
        }

        // Heart Background Effect
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 4000);
        }

        // Gift Logic
        function openGift(element, content) {
            if (element.classList.contains('opened')) return;
            element.innerHTML = "✨";
            setTimeout(() => {
                element.classList.add('opened');
                element.innerHTML = content;
                openedGifts++;
                if (openedGifts === 4) document.getElementById('gift-next').classList.remove('hidden');
            }, 400);
        }

        // Navigation
        function nextPage(pageNum) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page' + pageNum).classList.add('active');
            if(pageNum === 3) document.body.style.background = "#ffccd5";
        }
    </script>
</body>
  </html>
